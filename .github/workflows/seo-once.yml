name: One-time SEO metadata update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-once.yml'

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Phoenix Arcade metadata
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '''<meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <meta name="theme-color" content="#070411">
          <title>Phoenix Arcade</title>'''
          new = '''<meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <meta name="theme-color" content="#070411">
          <title>Phoenix Arcade — Free Online Arcade Shooter | Apps & Games</title>
          <meta name="description" content="Play Phoenix Arcade, a free modern browser shooter with waves, power-ups, desktop and touch controls, saved progress and multilingual support.">
          <meta name="robots" content="index, follow">
          <link rel="canonical" href="https://phoenix-arcade.appsandgames.org/">
          <meta property="og:type" content="website">
          <meta property="og:title" content="Phoenix Arcade — Free Online Arcade Shooter">
          <meta property="og:description" content="Play a modern browser arcade shooter with Phoenix enemies, power-ups and desktop or mobile controls.">
          <meta property="og:url" content="https://phoenix-arcade.appsandgames.org/">
          <meta property="og:site_name" content="Apps & Games">
          <meta property="og:image" content="https://appsandgames.org/assets/images/phoenix-arcade-cover.png">
          <meta property="og:image:alt" content="Phoenix Arcade game preview">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Phoenix Arcade | Apps & Games">
          <meta name="twitter:description" content="A free modern browser arcade shooter with waves, power-ups and mobile controls.">
          <meta name="twitter:image" content="https://appsandgames.org/assets/images/phoenix-arcade-cover.png">
          <script type="application/ld+json">
          {
            "@context":"https://schema.org",
            "@type":["VideoGame","SoftwareApplication"],
            "name":"Phoenix Arcade",
            "url":"https://phoenix-arcade.appsandgames.org/",
            "image":"https://appsandgames.org/assets/images/phoenix-arcade-cover.png",
            "description":"A free modern browser arcade shooter with Phoenix enemies, waves, power-ups, saved progress and desktop or touch controls.",
            "applicationCategory":"GameApplication",
            "gamePlatform":["Web browser","Desktop","Mobile"],
            "operatingSystem":"Any",
            "isAccessibleForFree":true,
            "inLanguage":["en","hr","de","it","es"],
            "publisher":{"@type":"Organization","name":"Apps & Games","url":"https://appsandgames.org/"},
            "offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}
          }
          </script>'''

          if 'rel="canonical" href="https://phoenix-arcade.appsandgames.org/"' not in text:
              if old not in text:
                  raise SystemExit("Expected Phoenix Arcade head block was not found; no changes made.")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/seo-once.yml")
          if workflow.exists():
              workflow.unlink()
      - name: Commit SEO update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "SEO: add Phoenix Arcade metadata"
          git push
