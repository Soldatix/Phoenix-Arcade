name: Upgrade Phoenix Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-phoenix-info.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Info
        run: python .github/scripts/upgrade-phoenix-info.py
      - name: Verify content
        run: |
          grep -q 'id="phoenix-standard-info"' index.html
          grep -q 'Doniraj putem PayPala' index.html
          grep -q 'copyPhoenixWallet' index.html
          grep -q 'Kopirano!' index.html
          test "$(grep -o 'class="phoenix-copy-btn"' index.html | wc -l)" -eq 8
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' not in attrs.lower(): scripts.append(body)
          Path('/tmp/phoenix-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/phoenix-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Phoenix Arcade Info design"
          git push
